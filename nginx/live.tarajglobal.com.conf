# ==============================================================================
# Nginx Virtual Host Configuration for live.tarajglobal.com
# For existing shared Nginx reverse proxy on Hostinger VPS (Ports 80 & 443)
# Routes:
#   - /api/       -> live-taraj-backend:5002 (Internal backend port)
#   - Everything  -> live-taraj-frontend:3002 (Internal frontend port)
# ==============================================================================

# Upstream definitions for internal Docker containers
upstream live_taraj_frontend {
    server live-taraj-frontend:3002;
    keepalive 32;
}

upstream live_taraj_backend {
    server live-taraj-backend:5002;
    keepalive 32;
}

# ------------------------------------------------------------------------------
# 1. HTTP Server (Port 80) - ACME challenge & HTTPS Redirect
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name live.tarajglobal.com;

    # Let's Encrypt / Certbot renewal challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. HTTPS Server (Port 443) - Reverse Proxy & SSL Termination
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name live.tarajglobal.com;

    # Maximum client payload size (for CSV/snapshot uploads)
    client_max_body_size 50M;

    # SSL Certificates (Managed via Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/live.tarajglobal.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/live.tarajglobal.com/privkey.pem;

    # Modern TLS protocols and cipher suites
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Dedicated Nginx health check endpoint
    location /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # --------------------------------------------------------------------------
    # Route: Backend API (/api/) -> live-taraj-backend:5002
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://live_taraj_backend;
        proxy_http_version 1.1;

        # WebSocket / SSE support for live events
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forwarded Client Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeout settings for database queries and sync jobs
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;

        # Buffer tuning for high throughput
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;
    }

    # --------------------------------------------------------------------------
    # Next.js Static Asset Caching (Immutable bundles)
    # --------------------------------------------------------------------------
    location /_next/static/ {
        proxy_pass http://live_taraj_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # --------------------------------------------------------------------------
    # Public Media & Font Assets
    # --------------------------------------------------------------------------
    location ~* \.(ico|css|js|gif|jpeg|jpg|png|woff|woff2|ttf|eot|svg)$ {
        proxy_pass http://live_taraj_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }

    # --------------------------------------------------------------------------
    # Route: Frontend Application (All pages) -> live-taraj-frontend:3002
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://live_taraj_frontend;
        proxy_http_version 1.1;

        # WebSocket / Server-Sent Events (SSE) support for live presentations
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard proxy forwarding headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeout configurations
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffer tuning
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;
    }
}
