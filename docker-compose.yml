version: "3.8"

# ========================================================
# Hostinger VPS Docker Compose Configuration
# Domain: live.tarajglobal.com
# Internal Ports: Frontend (3002), Backend (5002)
# Shared Services: Existing MySQL (3306), Existing Nginx (80/443)
# Note: Ports are NOT published to host VPS; traffic is routed
#       internally via Docker network by the shared Nginx proxy.
# ========================================================

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: live-taraj-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3002
      - HOSTNAME=0.0.0.0
      # Database Connection (connects to existing shared MySQL container)
      - DB_HOST=${DB_HOST:-mysql}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER:-u449458970_demandpulse}
      - DB_PASSWORD=${DB_PASSWORD:-}
      - DB_NAME=${DB_NAME:-u449458970_demandpulse}
      # CRM API & Secrets
      - CRM_API_BASE_URL=${CRM_API_BASE_URL:-https://app.tarajglobal.com/demandflowbridge/api/v1}
      - CRM_API_TOKEN=${CRM_API_TOKEN:-df_admin_secret_token_2026}
      - CRM_INCENTIVES_API_URL=${CRM_INCENTIVES_API_URL:-https://app.tarajglobal.com/demandflowbridge/api/v1/incentives}
      - ADMIN_AUTH_TOKEN=${ADMIN_AUTH_TOKEN:-df_admin_secret_token_2026}
      - SESSION_SECRET=${SESSION_SECRET:-change_me_to_a_long_random_secret}
      - NEXT_PUBLIC_APP_NAME=${NEXT_PUBLIC_APP_NAME:-DemandFlow Live Analytics}
      - NEXT_PUBLIC_REFRESH_INTERVAL=${NEXT_PUBLIC_REFRESH_INTERVAL:-30000}
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    expose:
      - "3002"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3002/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 25s
    networks:
      - shared-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: live-taraj-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5002
      - HOSTNAME=0.0.0.0
      # Database Connection (connects to existing shared MySQL container)
      - DB_HOST=${DB_HOST:-mysql}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER:-u449458970_demandpulse}
      - DB_PASSWORD=${DB_PASSWORD:-}
      - DB_NAME=${DB_NAME:-u449458970_demandpulse}
      # CRM API & Secrets
      - CRM_API_BASE_URL=${CRM_API_BASE_URL:-https://app.tarajglobal.com/demandflowbridge/api/v1}
      - CRM_API_TOKEN=${CRM_API_TOKEN:-df_admin_secret_token_2026}
      - CRM_INCENTIVES_API_URL=${CRM_INCENTIVES_API_URL:-https://app.tarajglobal.com/demandflowbridge/api/v1/incentives}
      - ADMIN_AUTH_TOKEN=${ADMIN_AUTH_TOKEN:-df_admin_secret_token_2026}
      - SESSION_SECRET=${SESSION_SECRET:-change_me_to_a_long_random_secret}
      - NEXT_PUBLIC_APP_NAME=${NEXT_PUBLIC_APP_NAME:-DemandFlow Live Analytics}
      - NEXT_PUBLIC_REFRESH_INTERVAL=${NEXT_PUBLIC_REFRESH_INTERVAL:-30000}
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    expose:
      - "5002"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5002/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 25s
    networks:
      - shared-network

networks:
  # Connects to the existing shared Docker network where shared Nginx & MySQL reside.
  # (If your VPS uses a different network name, e.g. web-proxy or app-network, set it in .env)
  shared-network:
    name: ${SHARED_NETWORK_NAME:-shared-network}
    external: true
