services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: demandpulse-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      # Discrete Hostinger Database Credentials
      - DB_HOST=${DB_HOST:-srv1274.hstgr.io}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER:-u449458970_demandpulse}
      - DB_PASSWORD=${DB_PASSWORD:-}
      - DB_NAME=${DB_NAME:-u449458970_demandpulse}
      # CRM API & Application Secrets
      - CRM_API_BASE_URL=${CRM_API_BASE_URL:-https://app.tarajglobal.com/demandflowbridge/api/v1}
      - CRM_API_TOKEN=${CRM_API_TOKEN:-df_admin_secret_token_2026}
      - CRM_INCENTIVES_API_URL=${CRM_INCENTIVES_API_URL:-https://app.tarajglobal.com/demandflowbridge/api/v1/incentives}
      - ADMIN_AUTH_TOKEN=${ADMIN_AUTH_TOKEN:-df_admin_secret_token_2026}
      - NEXT_PUBLIC_APP_NAME=${NEXT_PUBLIC_APP_NAME:-DemandFlow Live Analytics}
      - NEXT_PUBLIC_REFRESH_INTERVAL=${NEXT_PUBLIC_REFRESH_INTERVAL:-30000}
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 25s
    networks:
      - demandpulse-net

  nginx:
    image: nginx:1.25-alpine
    container_name: demandpulse-nginx
    restart: unless-stopped
    ports:
      # Exposes DemandPulse on Port 3003 as requested
      - "3003:3003"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3003/nginx-health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - demandpulse-net

networks:
  demandpulse-net:
    driver: bridge
